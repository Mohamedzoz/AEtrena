<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>غير متصل - Aeterna ERP</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1F1E1C;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      color: #fff;
      text-align: center;
      padding: 24px;
    }
    .icon { font-size: 64px; margin-bottom: 24px; opacity: 0.6; }
    h2 { font-size: 1.4rem; margin-bottom: 12px; }
    p { color: #aaa; line-height: 1.7; font-size: 0.95rem; max-width: 280px; }
    button {
      margin-top: 28px;
      padding: 14px 32px;
      background: #fff;
      color: #1F1E1C;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="icon">📡</div>
  <h2>لا يوجد اتصال بالإنترنت</h2>
  <p>تأكد من اتصالك بالشبكة، يحتاج Aeterna ERP لاتصال إنترنت للعمل</p>
  <button onclick="window.location.reload()">إعادة المحاولة</button>
</body>
</html>
