<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Aeterna ERP</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1F1E1C;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      color: #fff;
    }
    .logo-text {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 4px;
      color: #fff;
      margin-bottom: 8px;
    }
    .sub-text {
      font-size: 0.85rem;
      color: #999;
      letter-spacing: 2px;
      margin-bottom: 40px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-box {
      display: none;
      text-align: center;
      padding: 24px;
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
      max-width: 300px;
    }
    .error-box h3 { color: #e74c3c; margin-bottom: 10px; font-size: 1rem; }
    .error-box p { color: #aaa; font-size: 0.85rem; line-height: 1.6; }
    .retry-btn {
      margin-top: 16px;
      padding: 10px 28px;
      background: #fff;
      color: #1F1E1C;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="logo-text">AETERNA</div>
  <div class="sub-text">KITCHEN & DRESSING</div>
  <div class="spinner" id="spinner"></div>
  <div class="error-box" id="errorBox">
    <h3>⚠️ لا يوجد اتصال</h3>
    <p>تأكد من اتصالك بالإنترنت وأن السيرفر يعمل</p>
    <button class="retry-btn" onclick="retryConnect()">إعادة المحاولة</button>
  </div>

  <script>
    function retryConnect() {
      document.getElementById('errorBox').style.display = 'none';
      document.getElementById('spinner').style.display = 'block';
      setTimeout(tryNavigate, 500);
    }

    function showError() {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('errorBox').style.display = 'block';
    }

    function tryNavigate() {
      // إذا كان التطبيق يشتغل جوه Capacitor، server.url في الـ config هيتحمل تلقائياً
      // هذه الصفحة هي fallback فقط في حالة مشكلة في الاتصال
      var timeout = setTimeout(showError, 8000);
      fetch(window.location.origin + '/index.php', { method: 'HEAD' })
        .then(function(r) {
          clearTimeout(timeout);
          if (r.ok || r.status === 302 || r.status === 200) {
            window.location.href = '/index.php';
          } else { showError(); }
        })
        .catch(function() {
          clearTimeout(timeout);
          showError();
        });
    }

    // انتظر Capacitor لو موجود
    document.addEventListener('DOMContentLoaded', function() {
      if (window.Capacitor) {
        // Capacitor موجود - server.url هيتحمل تلقائياً
        setTimeout(tryNavigate, 1000);
      } else {
        tryNavigate();
      }
    });
  </script>
</body>
</html>
