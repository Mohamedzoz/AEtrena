name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'نوع البناء'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout الكود ───────────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ── 2. Setup Node.js ────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. Install npm packages ─────────────────────────────────
      - name: Install Dependencies
        run: npm ci

      # ── 4. Setup Java 17 ────────────────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 5. Setup Android SDK ────────────────────────────────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ── 6. Add Capacitor Android Platform ──────────────────────
      - name: Add Capacitor Android
        run: npx cap add android

      # ── 7. Sync Web Assets ──────────────────────────────────────
      - name: Sync Capacitor
        run: npx cap sync android

      # ── 8. Apply Security Patches ──────────────────────────────
      - name: Apply Android Security Patches
        run: bash scripts/android-security-patch.sh

      # ── 9. Grant Gradle Execute Permission ─────────────────────
      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      # ── 10. Build DEBUG APK ─────────────────────────────────────
      - name: Build Debug APK
        if: github.event.inputs.build_type != 'release'
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      # ── 11. Build RELEASE APK (لو عندك Keystore) ───────────────
      - name: Build Release APK
        if: github.event.inputs.build_type == 'release' && secrets.KEYSTORE_BASE64 != ''
        run: |
          # فك تشفير الـ Keystore من secrets
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore
          cd android
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=release.keystore \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}" \
            --stacktrace
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      # ── 12. Upload Debug APK ────────────────────────────────────
      - name: Upload Debug APK
        if: github.event.inputs.build_type != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: aeterna-erp-debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ── 13. Upload Release APK ──────────────────────────────────
      - name: Upload Release APK
        if: github.event.inputs.build_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: aeterna-erp-release-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90

      # ── 14. Summary ─────────────────────────────────────────────
      - name: Build Summary
        if: always()
        run: |
          echo "## نتيجة البناء 🏗️" >> $GITHUB_STEP_SUMMARY
          echo "- **Build #**: ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Type**: ${{ github.event.inputs.build_type || 'debug' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
